name: Quantize Qwen3-0.6B (LiteRT-LM int4)

# 在 Linux x86_64 上执行转换/量化（macOS 上 TF 与 PyTorch 有 LLVM 冲突）
#
# 私有仓库也完全够用：Free 计划 2,000 Actions 分钟/月（ubuntu = 1x），
# 本任务 ~30-60 分钟。产物走 Release 资产（单文件 2 GB），不占 500 MB artifact 存储。
on:
  workflow_dispatch:
    inputs:
      block_size:
        description: "int4 block size"
        default: "64"
        required: false
      quantize_embedding:
        description: "量化 embedding / lm_head（true 才能到 ~300MB）"
        default: "true"
        required: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-litert-${{ runner.os }}-py310

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install litert-torch litert-lm-builder tensorflow hf_transfer huggingface_hub

      - name: API recon (first run doubles as reconnaissance)
        run: python scripts/export_int4.py --inspect
        continue-on-error: true

      - name: Download base model
        run: |
          HF_HUB_ENABLE_HF_TRANSFER=1 hf download Qwen/Qwen3-0.6B --local-dir model

      - name: Export + quantize
        run: |
          python scripts/export_int4.py \
            --model model \
            --output out \
            --block-size "${{ inputs.block_size }}" \
            --quantize-embedding "${{ inputs.quantize_embedding }}" \
            --recipe dynamic_wi4c_afp32

      - name: Inspect artifact (size gate)
        run: |
          set -e
          f=$(ls out/*.litertlm | head -1)
          ls -lh "$f"
          litert-lm-peek --litertlm_file "$f" \
            | grep -E "Section [0-9]+:|Data Type|Begin Offset|End Offset"
          size=$(stat -c%s "$f")
          echo "artifact_bytes=$size"
          python - <<'PY'
          import os, glob
          f = glob.glob('out/*.litertlm')[0]
          mb = os.path.getsize(f) / 1e6
          print(f"ARTIFACT_MB={mb:.1f}")
          assert mb <= 340, f"体积超标: {mb:.1f} MB (目标 <= 340 MB)"
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-0.6b-int4-full
          path: out/*.litertlm
          retention-days: 3
          compression-level: 0

      - name: Publish release asset
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.litertlm
          tag_name: qwen3-0.6b-int4-${{ github.run_number }}
          name: Qwen3-0.6B int4 (LiteRT-LM)
          body: |
            Generated by .github/workflows/quantize.yml
            block_size=${{ inputs.block_size }} quantize_embedding=${{ inputs.quantize_embedding }}
